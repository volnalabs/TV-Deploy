[workspace]
resolver = "2"
members = ["crates/easytizen-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/volnalabs/TV-Deploy"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# Optimise dependencies in debug/test builds too: RSA key generation is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 2
