[package]
name = "tvdeploy-core"
description = "TV Deploy core: safe WGT analysis, validated Samsung CLI invocation, diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"
