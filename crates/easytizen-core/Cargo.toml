[package]
name = "easytizen-core"
description = "EasyTizen core: safe WGT analysis and signing, native SDB client, Samsung certificate flow, diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Protocol-level TV emulator for automated tests and UI development without a television.
mock-tv = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
base64 = "0.22"
p12-keystore = "0.4"
sha2 = "0.11"
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-cert = { version = "0.3", features = ["builder", "pem"] }
ureq = "3"
getrandom = { version = "0.4", features = ["sys_rng"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "mock_tv"
required-features = ["mock-tv"]
