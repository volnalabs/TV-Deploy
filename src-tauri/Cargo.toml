[package]
name = "easytizen"
description = "A simple and modern application installer for Samsung Smart TVs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "easytizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
easytizen-core = { path = "../crates/easytizen-core" }

[dev-dependencies]
tempfile = "3"
