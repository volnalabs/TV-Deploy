name: Build and release

on:
  workflow_dispatch:
  push:
    branches: [development]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: windows-latest, node: win-x64, args: "" }
          - { name: macOS-ARM64, os: macos-latest, node: darwin-arm64, args: "--target aarch64-apple-darwin" }
          - { name: macOS-x64, os: macos-15-intel, node: darwin-x64, args: "--target x86_64-apple-darwin" }
          - { name: Linux-x64, os: ubuntu-22.04, node: linux-x64, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.node, 'darwin') && (matrix.node == 'darwin-arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download and verify the bundled Node.js runtime
        run: node scripts/fetch-node.mjs ${{ matrix.node }}
      - name: Build TV Deploy
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Deploy-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish unsigned platform installers
        uses: softprops/action-gh-release@v2
        with:
          name: TV Deploy ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
