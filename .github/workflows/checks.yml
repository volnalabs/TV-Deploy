name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The signing and certificate tests are verified by independent tools (OpenSSL,
      # xmlsec1). On Linux they are mandatory: a missing tool fails the job.
      - name: Install xmlsec1 (independent signature verifier)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: cargo fmt -p easytizen-core -- --check
      - run: cargo clippy -p easytizen-core --all-targets --features mock-tv -- -D warnings
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export EASYTIZEN_REQUIRE_INTEROP=1; fi
          cargo test -p easytizen-core --features mock-tv

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  app:
    name: App backend (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx vite build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p easytizen --all-targets -- -D warnings
      - run: cargo test -p easytizen
